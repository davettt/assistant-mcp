# Publishes to npm when a version tag is pushed. No npm token: npm's trusted publishing
# trusts this repository + this workflow filename through GitHub's OIDC token, and
# provenance is generated automatically for a public repo and package.
#
# One-time setup (npm docs, "Trusted publishers", read 2026-10-18):
#   1. The package must already exist, so the FIRST version is published by the developer
#      from a terminal with 2FA (npm publish --access public), then
#   2. npmjs.com → package → Settings → Trusted publishing → GitHub Actions:
#      owner davettt, repository assistant-mcp, workflow filename publish.yml.
#      The connection expires if no publish succeeds within 2 days of creating it.
#   3. Package Settings → Publishing access → require 2FA and disallow tokens.
# The tag's version must match package.json; the job checks before publishing.
name: Publish

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run validate
      - run: npm test
      - name: Tag matches package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "require('./package.json').version")"
          test "$tag" = "$version" || { echo "tag v$tag != package.json $version"; exit 1; }
      - run: npm publish --access public
